name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linter-tests:
    name: PRD linter unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run validate_prd.py test suite
        run: python3 skills/prd-maker/scripts/test_validate_prd.py
      - name: Run prd_to_html.py test suite
        run: python3 skills/prd-maker/scripts/test_prd_to_html.py
      - name: Example PRDs must pass the linter
        shell: bash
        run: |
          shopt -s nullglob
          files=(docs/examples/*.md)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no docs/examples/*.md yet - skipped"
            exit 0
          fi
          for f in "${files[@]}"; do
            echo "--- $f"
            python3 skills/prd-maker/scripts/validate_prd.py "$f"
          done

  skill-structure:
    name: Skill structure integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check SKILL.md constraints and reference integrity
        run: python3 .github/scripts/check_skill_structure.py

  plugin-manifest:
    name: Plugin manifest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Deterministic gate: manifests parse and carry the required fields.
      # Runs first so manifest problems fail clearly even if the CLI step is skipped.
      - name: Validate manifests (deterministic)
        run: python3 .github/scripts/check_manifests.py
      # The real thing the maintainer runs locally. Best-effort: the CLI is
      # installed fresh in the runner; if a future CLI change breaks headless
      # invocation, the deterministic check above still gates the job.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: claude plugin validate
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .

  lint:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v3
